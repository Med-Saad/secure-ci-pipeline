# CI for this repo: test the gate engine, then dogfood it by running the gate
# against this very repo. The badge in the README points at this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 1. the gate must be correct before it is trusted to gate -------------
  test:
    name: "pytest (gate engine)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          pip install --quiet ".[dev]"
          pytest -q

  # --- 2. dogfood: run the gate on this repo (produces the CI badge) --------
  # This repo is dependency-free; its only committed dependency manifests are the
  # sample trudesk SBOM under examples/ and the KEV tripwire lockfile under tests/.
  # Neither is THIS repo's supply chain, so both are excluded from dependency and
  # SAST scanning here — the tripwire gets its own job below. Without this, OSV
  # parses the committed SBOM and re-imports all of trudesk's vulns into the
  # self-scan, and the tripwire's KEV entry keeps the badge permanently red.
  self-scan:
    name: "self-scan"
    needs: test
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-image: false            # this repo ships no image
      secrets-full-history: true   # scan the whole history for planted secrets
      dep-scan-excludes: "examples,tests"
      sast-excludes: "examples,tests"
      fail-on-block: true
    permissions:
      contents: read
      security-events: write

  # --- 2b. the KEV tripwire, exercised in isolation -------------------------
  # The tripwire fixture pins a real KEV CVE (CVE-2021-21315). We scan ONLY the
  # fixture with the real OSV binary and the live CISA KEV feed, and assert the
  # gate BLOCKS via the KEV path. The job passes precisely WHEN the block fires
  # (inverted exit code), so a regression that stops the KEV rule from firing
  # turns this job red. This is the end-to-end complement to the unit test in
  # tests/test_kev_tripwire.py.
  tripwire:
    name: "kev-tripwire (must block)"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install ci-gate + OSV-Scanner
        run: |
          pip install --quiet .
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/
      - name: Scan the tripwire fixture
        run: |
          osv-scanner scan source \
            --lockfile=tests/fixtures/kev-tripwire/package-lock.json \
            --format=json --output=osv.json || true
          curl -fsSL -o kev.json \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
      - name: Assert the gate blocks via the KEV path
        run: |
          set +e
          python -m gate evaluate --osv osv.json --kev kev.json \
            --title "KEV tripwire" --summary tripwire.md --json tripwire.json --quiet
          rc=$?
          cat tripwire.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 1 ]; then
            echo "::error::tripwire did NOT block — the KEV gate is broken"
            exit 1
          fi
          if ! grep -q "CVE-2021-21315" tripwire.md; then
            echo "::error::tripwire blocked, but not on the expected KEV CVE"
            exit 1
          fi
          echo "tripwire fired correctly on the KEV path"

  # --- 3. stretch: keyless-sign the SBOM + attest provenance (main only) ----
  # Demonstrates cosign keyless (OIDC, no long-lived keys) and SLSA-style build
  # provenance. Runs only on push to main so PRs from forks never get id-token.
  sign:
    name: "sign SBOM (cosign keyless + provenance)"
    needs: self-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # OIDC token for keyless signing
      attestations: write    # build provenance attestation
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: security-gate-self
          path: out
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Keyless sign the SBOM
        run: |
          cosign sign-blob --yes \
            --output-signature out/sbom.cdx.json.sig \
            --output-certificate out/sbom.cdx.json.pem \
            out/sbom.cdx.json
      - name: Attest build provenance for the SBOM
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: out/sbom.cdx.json
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: signed-sbom
          path: |
            out/sbom.cdx.json
            out/sbom.cdx.json.sig
            out/sbom.cdx.json.pem
          retention-days: 30
