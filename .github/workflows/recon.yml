# THROWAWAY. Stage-B target triage only -- delete once a scan target is chosen.
#
# Purpose: decide between trudesk and mongo-express on a clean ubuntu-latest
# runner. Criterion zero (does the Dockerfile still build) gates everything
# else, so a candidate that fails to build is never scanned.
#
# Actions below are referenced by tag, not SHA. That is deliberate for a
# throwaway: the production pipeline pins every action to a full commit SHA
# (see README -- tj-actions/changed-files, March 2025). Pinning is a property
# of the pipeline we are building, not of the recon that chooses its input.

name: recon (throwaway)

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Which candidates to triage"
        type: choice
        default: both
        options: [both, trudesk, mongo-express]

permissions:
  contents: read

concurrency:
  group: recon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Criterion zero. Everything downstream is conditioned on this.
  # ---------------------------------------------------------------------------
  build:
    name: "criterion-zero: docker build (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # we want data on BOTH candidates, not the first failure
      matrix:
        include:
          - name: trudesk
            repo: https://github.com/polonel/trudesk.git
            sha: 29f3f1698f341e3d8fcc4f4eb5340ee43427fe63
          - name: mongo-express
            repo: https://github.com/mongo-express/mongo-express.git
            sha: af0a71fd074450b733157decb8d625053b5df821
    outputs:
      trudesk: ${{ steps.result.outputs.trudesk }}
      mongo-express: ${{ steps.result.outputs.mongo-express }}
    steps:
      - name: Skip if not selected
        id: gate
        run: |
          want='${{ inputs.candidates }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Full history: the Gitleaks baseline and merge-base diffs both need it,
      # so we confirm here that a depth-0 clone of this repo is tractable.
      - name: Clone candidate at pinned SHA
        if: steps.gate.outputs.run == 'true'
        run: |
          git clone --quiet '${{ matrix.repo }}' src
          git -C src checkout --quiet '${{ matrix.sha }}'
          echo "commits=$(git -C src rev-list --count HEAD)"
          du -sh src

      - name: docker build
        if: steps.gate.outputs.run == 'true'
        id: dockerbuild
        continue-on-error: true
        run: |
          set -o pipefail
          start=$SECONDS
          docker build -t 'recon/${{ matrix.name }}:pinned' src 2>&1 | tee build.log
          rc=$?
          echo "duration=$((SECONDS-start))" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Record build outcome
        if: steps.gate.outputs.run == 'true'
        id: result
        run: |
          ok='${{ steps.dockerbuild.outcome }}'
          echo '${{ matrix.name }}=${{ steps.dockerbuild.outcome }}' >> "$GITHUB_OUTPUT"
          {
            echo "## criterion zero -- ${{ matrix.name }}"
            echo ""
            echo "- build: **$ok** (${{ steps.dockerbuild.outputs.duration }}s)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" != "success" ]; then
            {
              echo ""
              echo "<details><summary>last 40 lines of build log</summary>"
              echo ""
              echo '```'
              tail -40 build.log || true
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Image size and layer count
        if: steps.gate.outputs.run == 'true' && steps.dockerbuild.outcome == 'success'
        run: |
          {
            echo "- image size: $(docker image inspect 'recon/${{ matrix.name }}:pinned' --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')"
            echo "- layers: $(docker image inspect 'recon/${{ matrix.name }}:pinned' --format '{{len .RootFS.Layers}}')"
            echo "- runs as: $(docker image inspect 'recon/${{ matrix.name }}:pinned' --format '{{if .Config.User}}{{.Config.User}}{{else}}root (no USER directive){{end}}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save image for scanning
        if: steps.gate.outputs.run == 'true' && steps.dockerbuild.outcome == 'success'
        run: docker save 'recon/${{ matrix.name }}:pinned' -o '${{ matrix.name }}-image.tar'

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && steps.dockerbuild.outcome == 'success'
        with:
          name: image-${{ matrix.name }}
          path: ${{ matrix.name }}-image.tar
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Finding counts. Runs even if the build failed -- a candidate that fails
  # criterion zero is still worth counting, because a cheap base-image bump may
  # rescue it and we want to know whether the wall is worth the rescue.
  # ---------------------------------------------------------------------------
  scan:
    name: "counts: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trudesk
            repo: https://github.com/polonel/trudesk.git
            sha: 29f3f1698f341e3d8fcc4f4eb5340ee43427fe63
            # 186k lines in mobile/lib + 119k in src/public/js are vendored or
            # bundled. Counting both scoped and unscoped is the point: the
            # delta is the first tuning decision the project has to defend.
            exclude: "mobile/lib,src/public,node_modules,test"
          - name: mongo-express
            repo: https://github.com/mongo-express/mongo-express.git
            sha: af0a71fd074450b733157decb8d625053b5df821
            exclude: "node_modules,test,cypress"
    steps:
      - name: Skip if not selected
        id: gate
        run: |
          want='${{ inputs.candidates }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone candidate at pinned SHA
        if: steps.gate.outputs.run == 'true'
        run: |
          git clone --quiet '${{ matrix.repo }}' src
          git -C src checkout --quiet '${{ matrix.sha }}'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install scanners
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          # Resolve the linux/amd64 asset from the latest release rather than
          # guessing a filename -- asset naming has changed across releases.
          url=$(curl -sSL https://api.github.com/repos/google/osv-scanner/releases/latest \
                | jq -r '.assets[] | select(.name | test("linux_amd64$")) | .browser_download_url' | head -1)
          echo "osv-scanner asset: $url"
          curl -sSL -o /usr/local/bin/osv-scanner "$url"
          chmod +x /usr/local/bin/osv-scanner
          echo "semgrep: $(semgrep --version)"
          echo "osv-scanner: $(osv-scanner --version 2>&1 | head -1)"

      # --- SAST ---------------------------------------------------------------
      - name: Semgrep (unscoped)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          semgrep scan --config=p/default --config=p/javascript \
            --sarif --output=semgrep-unscoped.sarif --metrics=off --quiet src || true

      - name: Semgrep (scoped to first-party code)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          args=""
          IFS=',' read -ra EX <<< '${{ matrix.exclude }}'
          for e in "${EX[@]}"; do args="$args --exclude=$e"; done
          echo "exclusions: $args"
          semgrep scan --config=p/default --config=p/javascript \
            $args --sarif --output=semgrep-scoped.sarif --metrics=off --quiet src || true

      # --- Dependencies -------------------------------------------------------
      # Load-bearing check: both candidates ship Yarn Berry lockfiles
      # (__metadata version 6/8). The whole app-dep gate assumes OSV parses
      # these. If this step reports zero packages, that assumption is wrong and
      # the tool split has to change.
      - name: OSV-Scanner (yarn.lock -- Berry format)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          osv-scanner scan source --lockfile=src/yarn.lock --format=json --output=osv.json || true
          echo "--- sanity: did OSV actually parse the Berry lockfile? ---"
          jq -r '[.results[]?.packages[]?] | length' osv.json || echo "PARSE FAILED"

      # --- Image layer --------------------------------------------------------
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        with:
          name: image-${{ matrix.name }}
          path: image

      - name: Trivy (image, report-only)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          if [ ! -f "image/${{ matrix.name }}-image.tar" ]; then
            echo "no image artifact -- build failed criterion zero, skipping image scan"
            exit 0
          fi
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:latest image \
            --input "image/${{ matrix.name }}-image.tar" \
            --format json --output trivy-image.json --quiet || true

      - name: Trivy (app deps, report-only -- the comparison arm)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:latest fs \
            --scanners vuln src \
            --format json --output trivy-fs.json --quiet || true

      - name: Hadolint
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint hadolint -f json - < src/Dockerfile > hadolint.json || true

      # --- Summary ------------------------------------------------------------
      - name: Summarise counts
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, collections, pathlib

          name = "${{ matrix.name }}"

          def load(p):
              try:
                  return json.loads(pathlib.Path(p).read_text())
              except Exception:
                  return None

          def sarif_sev(path):
              d = load(path)
              if not d:
                  return None
              c = collections.Counter()
              for run in d.get("runs", []):
                  rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  for res in run.get("results", []):
                      lvl = res.get("level")
                      if not lvl:
                          rule = rules.get(res.get("ruleId"), {})
                          lvl = rule.get("defaultConfiguration", {}).get("level", "warning")
                      c[lvl] += 1
              return c

          print(f"## counts -- {name}\n")

          for label, f in [("Semgrep unscoped", "semgrep-unscoped.sarif"),
                           ("Semgrep scoped", "semgrep-scoped.sarif")]:
              c = sarif_sev(f)
              if c is None:
                  print(f"- **{label}**: no output (step failed)")
              else:
                  print(f"- **{label}**: {sum(c.values())} total -- " +
                        ", ".join(f"{k} {v}" for k, v in sorted(c.items())))

          osv = load("osv.json")
          if osv:
              pkgs = [p for r in osv.get("results", []) for p in r.get("packages", [])]
              vulns = [v for p in pkgs for v in p.get("vulnerabilities", [])]
              uniq = {v.get("id") for v in vulns}
              print(f"- **OSV-Scanner**: {len(uniq)} unique advisories across "
                    f"{len({p['package']['name'] for p in pkgs if p.get('vulnerabilities')})} affected packages "
                    f"({len(pkgs)} packages parsed)")
              if not pkgs:
                  print("  - :warning: **zero packages parsed -- Yarn Berry support is NOT working**")
          else:
              print("- **OSV-Scanner**: no output")

          for label, f in [("Trivy fs (app deps)", "trivy-fs.json"),
                           ("Trivy image (OS layer)", "trivy-image.json")]:
              d = load(f)
              if not d:
                  print(f"- **{label}**: no output")
                  continue
              c = collections.Counter()
              for r in d.get("Results", []):
                  for v in r.get("Vulnerabilities", []) or []:
                      c[v.get("Severity", "UNKNOWN")] += 1
              print(f"- **{label}**: {sum(c.values())} total -- " +
                    (", ".join(f"{k} {v}" for k, v in c.most_common()) or "none"))

          h = load("hadolint.json")
          if isinstance(h, list):
              c = collections.Counter(x.get("level", "?") for x in h)
              print(f"- **Hadolint**: {len(h)} findings -- " +
                    (", ".join(f"{k} {v}" for k, v in c.most_common()) or "none"))
          PY

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: recon-raw-${{ matrix.name }}
          path: |
            *.sarif
            *.json
          retention-days: 7
