# Real suppression file for the trudesk TARGET audit (used by target-scan).
# Basis: MEASURED, not inferred. Each package below carries HIGH+ advisories in
# the source yarn.lock but is ABSENT from the built container image (compared
# against the Trivy image scan). A vulnerability in a package that is not present
# in the deployed artifact is not reachable at runtime in production.
#
# Confidence: HIGH that these are not RUNTIME-reachable (the image is the
# evidence). NOTE the narrow scope: this does NOT claim they are harmless — a
# compromised BUILD-time dependency is a real supply-chain threat, just a
# different one than a runtime CVE. These block the runtime severity gate only.
#
# All entries expire (annual re-review); an expired suppression re-surfaces.
# Regenerate: cross-reference OSV source deps vs. Trivy image packages.
suppressions:
  - id: SUP-BUILD-angular-compiler
    reason: >
      @angular/compiler: 2 HIGH+ advisory(ies) in yarn.lock, absent from the built
      image (build-time tooling); not runtime-reachable. Advisories: GHSA-jrmj-c5cx-3cw6, GHSA-v4hv-rgfq-gp49
    expires: "2027-07-23"
    match:
      domain: deps
      package: "@angular/compiler"
